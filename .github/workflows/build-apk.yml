name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create missing project files
        run: flutter create --org com.majaaj --overwrite .

      - name: Restore our app code
        run: git checkout HEAD -- lib pubspec.yaml

      - name: Set minSdkVersion to 23
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/(minSdkVersion[[:space:]]+).+/\1 23/' android/app/build.gradle
            sed -i -E 's/(minSdk[[:space:]]*=[[:space:]]*).+/\1 23/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/(minSdk[[:space:]]*=[[:space:]]*).+/\1 23/' android/app/build.gradle.kts
          fi
          echo "--- Result ---"
          grep -n "minSdk" android/app/build.gradle* || true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
