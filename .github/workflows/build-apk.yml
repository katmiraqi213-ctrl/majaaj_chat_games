name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Set minSdkVersion to 23
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/(minSdkVersion[[:space:]]+).+/\1 23/' android/app/build.gradle
            sed -i -E 's/(minSdk[[:space:]]*=[[:space:]]*).+/\1 23/' android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/(minSdk[[:space:]]*=[[:space:]]*).+/\1 23/' android/app/build.gradle.kts
          fi

      - name: Get Flutter packages
        run: flutter pub get

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/release-key.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Mazaaj, OU=Mazaaj, O=Mazaaj, L=Mosul, ST=Nineveh, C=IQ"

      - name: Create key.properties
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=release
          storeFile=release-key.jks
          EOF

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit("android/app/build.gradle not found")

          text = path.read_text()

          signing = '''
          android {
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword "android"
                      keyAlias "release"
                      keyPassword "android"
                  }
              }
          }
          '''

          if 'signingConfigs {' not in text:
              text = text.replace(
                  'android {',
                  signing + '\nandroid {',
                  1
              )

          if 'signingConfig signingConfigs.release' not in text:
              text = text.replace(
                  'versionName "1.0.0"',
                  'versionName "1.0.0"\n        signingConfig signingConfigs.release'
              )

          path.write_text(text)
          PY

      - name: Clean Flutter
        run: flutter clean

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Verify APK
        run: |
          echo "=== APK INFO ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk

          echo "=== ZIP TEST ==="
          unzip -t build/app/outputs/flutter-apk/app-release.apk

          echo "=== APK SIGNATURE ==="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
