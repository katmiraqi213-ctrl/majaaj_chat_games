name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # خطوة هامة لقبول تراخيص أندرويد لمنع فشل البناء
      - name: Accept Android Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # إرسال إشعار النجاح بالرابط الصحيح
      - name: Send Telegram Notification on Success
        if: success()
        run: |
          curl -s -X POST "https://telegram.org{{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🔔 تم بناء ملف الـ APK بنجاح واكتمال المشروع! 🎉"

      # إرسال إشعار الفشل بالرابط الصحيح
      - name: Send Telegram Notification on Failure
        if: failure()
        run: |
          curl -s -X POST "https://telegram.org{{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ فشل بناء ملف الـ APK. يرجى مراجعة الأخطاء."
